[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specconvert"
version = "0.1.0"
description = "Astronomical wavelength and spectral flux conversions"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Jonah Powley", email = "jmp258@cam.ac.uk"},
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "astropy"]

[project.urls]
Homepage = "https://github.com/jonahpowley/specconvert"
Repository = "https://github.com/jonahpowley/specconvert"
Issues = "https://github.com/jonahpowley/specconvert/issues"

[tool.setuptools.packages.find]
where = ["src"]
