[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "specconvert"
version = "0.1.0"
description = "Astronomical wavelength and spectral flux conversions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "astropy"]

[tool.setuptools.packages.find]
where = ["src"]
